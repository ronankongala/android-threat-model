name: Tests

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # benchmarks/ is not committed and no emulator runs in CI, so tests that need
      # a built Ghera APK or adb skip themselves. tests/test_dynamic.py is the
      # emulator test and is always ignored here.
      - name: Run pytest
        id: pytest
        run: |
          set +e
          python -m pytest tests/ --ignore=tests/test_dynamic.py -rs --junitxml=pytest-results.xml
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Report pass and fail counts
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse('pytest-results.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else list(root)
          total = sum(int(s.get('tests', 0)) for s in suites)
          failed = sum(int(s.get('failures', 0)) for s in suites)
          errors = sum(int(s.get('errors', 0)) for s in suites)
          skipped = sum(int(s.get('skipped', 0)) for s in suites)
          passed = total - failed - errors - skipped
          line = 'pytest: %d passed, %d failed, %d errors, %d skipped' % (passed, failed, errors, skipped)
          print(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## Test results\n\n| Passed | Failed | Errors | Skipped |\n|---:|---:|---:|---:|\n')
              f.write('| %d | %d | %d | %d |\n' % (passed, failed, errors, skipped))
          PY

      - name: Fail the job when tests failed
        if: steps.pytest.outputs.status != '0'
        run: exit 1
